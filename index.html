<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e5ece6" />
    <meta
      name="description"
      content="Borderfall: ein rundenbasiertes Strategiespiel auf einer Weltkarte. Spiele gegen bis zu drei Computergegner."
    />
    <title>Borderfall · Dein Zug. Deine Welt.</title>
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Borderfall" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div class="app">
      <main class="workspace">
        <section class="map-panel" aria-label="Weltkarte">
          <h1 class="sr-only">Borderfall – Weltkarte</h1>
          <div class="map-canvas" id="map-canvas">
            <nav class="map-menu" aria-label="Spielmenü">
              <button
                class="icon-button"
                id="menu-button"
                aria-label="Spielmenü öffnen"
                title="Menü"
              ></button>
            </nav>
            <svg
              id="world-map"
              viewBox="0 0 1220 720"
              role="group"
              aria-label="42 Gebiete. Wähle ein Gebiet, um deinen Zug auszuführen."
            ></svg>
            <div
              class="continent-bonuses"
              id="continent-bonuses"
              aria-label="Truppenboni bei vollständiger Kontrolle eines Kontinents"
            ></div>
            <button
              id="zoom-reset"
              class="zoom-reset"
              aria-label="Kartenansicht zurücksetzen"
              title="Kartenansicht zurücksetzen"
              hidden
            ></button>
            <div class="scoreboard-widget" id="scoreboard-widget">
              <section class="scoreboard" id="scoreboard" aria-label="Spielerübersicht"></section>
            </div>
            <div class="map-tooltip" id="map-tooltip" hidden></div>
            <div class="map-hint" id="map-hint" role="status" aria-live="polite" aria-atomic="true">
              <div class="hint-content" id="hint-content"></div>
            </div>
            <div class="cards-bar" id="cards-bar"></div>
            <nav class="floating-actions" aria-label="Spielaktionen">
              <div class="map-phase" id="phase-label" role="status" aria-live="polite"></div>
              <div class="floating-controls">
                <section
                  class="action-card"
                  id="action-card"
                  aria-label="Aktuelle Aktion"
                ></section>
                <div class="turn-actions" id="turn-actions"></div>
              </div>
            </nav>
          </div>
        </section>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modal-layer" class="modal-layer" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
